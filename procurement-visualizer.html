<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transformer Procurement Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2340; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  #scene { position: fixed; inset: 0; }

  #panel {
    position: fixed; top: 16px; left: 16px;
    background: rgba(255,255,255,0.95); border-radius: 12px; padding: 14px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35); max-width: 260px;
  }
  #panel h1 { font-size: 15px; color: #1a2340; margin-bottom: 4px; }
  #panel .sub { font-size: 11px; color: #6b7a99; margin-bottom: 10px; }
  #panel .stat { font-size: 12px; color: #1a2340; margin-bottom: 2px; }
  #panel .stat b { color: #b8860b; }

  #exportBtn {
    margin-top: 10px; width: 100%; padding: 8px 10px; font-size: 12px; font-weight: 600;
    background: #1a2340; color: #fff; border: none; border-radius: 6px; cursor: pointer;
  }
  #exportBtn:hover { background: #253460; }

  #tooltip {
    position: fixed; pointer-events: none; display: none;
    background: #1a2340; color: #fff; font-size: 12px; padding: 8px 12px;
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); line-height: 1.5;
    border: 1px solid #f5c200;
  }
  #tooltip b { color: #f5c200; }

  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.9); color: #1a2340; font-size: 11px;
    padding: 6px 14px; border-radius: 99px;
  }
</style>
</head>
<body>

<div id="scene"></div>

<div id="panel">
  <h1>Transformer Procurement</h1>
  <div class="sub" id="meta">Loading…</div>
  <div class="stat">Bullpen (unallocated): <b id="bullpenCount">–</b></div>
  <div class="stat">Allocated: <b id="allocCount">–</b></div>
  <button id="exportBtn">⬇ Export Updated JSON</button>
</div>

<div id="tooltip"></div>
<div id="hint">Drag a transformer onto a project ring to allocate it · Drag to center to unallocate</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Config ----------
const BULLPEN_RADIUS = 10;
const PROJECT_RING_RADIUS = 45;
const CLUSTER_RADIUS = 6;
const DROP_THRESHOLD = 12; // how close (world units) a drop must be to snap to a zone

let transformers = [];
let projects = [];
let projectPositions = {}; // name -> THREE.Vector3

// ---------- Scene setup ----------
const container = document.getElementById('scene');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2340);
scene.fog = new THREE.Fog(0x1a2340, 80, 220);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 70, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(40, 60, 30);
scene.add(dirLight);

// Ground grid
const grid = new THREE.GridHelper(220, 44, 0x33406b, 0x252f52);
scene.add(grid);

// Invisible drag plane (y = 1)
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1);

// ---------- Groups ----------
const projectGroup = new THREE.Group();
const transformerGroup = new THREE.Group();
scene.add(projectGroup, transformerGroup);

// ---------- Helpers ----------
function colorForProject(name) {
  if (!name) return 0x8a93ad; // bullpen grey
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return new THREE.Color(`hsl(${hue}, 65%, 55%)`).getHex();
}

function makeTextSprite(text, color = '#ffffff', size = 64) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 128;
  ctx.font = `bold ${size}px Segoe UI, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, 256, 80);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(14, 3.5, 1);
  return sprite;
}

// ---------- Build project nodes (ring layout) ----------
function buildProjects(projectList) {
  projectList.forEach((p, i) => {
    const angle = (i / projectList.length) * Math.PI * 2;
    const pos = new THREE.Vector3(
      Math.cos(angle) * PROJECT_RING_RADIUS,
      0,
      Math.sin(angle) * PROJECT_RING_RADIUS
    );
    projectPositions[p.name] = pos;

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(5, 5.5, 0.6, 24),
      new THREE.MeshStandardMaterial({ color: colorForProject(p.name), transparent: true, opacity: 0.35 })
    );
    platform.position.copy(pos);
    platform.userData = { isProjectPlatform: true, name: p.name };
    projectGroup.add(platform);

    const label = makeTextSprite(p.name, '#f5c200', 44);
    label.position.set(pos.x, 6, pos.z);
    projectGroup.add(label);
  });

  // Bullpen platform (center)
  const bullpen = new THREE.Mesh(
    new THREE.CylinderGeometry(BULLPEN_RADIUS, BULLPEN_RADIUS + 1, 0.6, 32),
    new THREE.MeshStandardMaterial({ color: 0x8a93ad, transparent: true, opacity: 0.25 })
  );
  bullpen.userData = { isProjectPlatform: true, name: null };
  projectGroup.add(bullpen);
  const bullpenLabel = makeTextSprite('BULLPEN', '#ffffff', 44);
  bullpenLabel.position.set(0, 6, 0);
  projectGroup.add(bullpenLabel);
}

// ---------- Layout transformers into their zone ----------
function clusterSlot(index, count, center, radius) {
  const cols = Math.ceil(Math.sqrt(count));
  const row = Math.floor(index / cols);
  const col = index % cols;
  const spacing = Math.min(radius * 2 / cols, 3.5);
  const offsetX = (col - (cols - 1) / 2) * spacing;
  const offsetZ = (row - (cols - 1) / 2) * spacing;
  return new THREE.Vector3(center.x + offsetX, 1.4, center.z + offsetZ);
}

function relayout(animate = true) {
  const byZone = {};
  transformers.forEach(t => {
    const key = t.project || '__bullpen__';
    (byZone[key] = byZone[key] || []).push(t);
  });

  Object.entries(byZone).forEach(([key, list]) => {
    const center = key === '__bullpen__' ? new THREE.Vector3(0, 0, 0) : projectPositions[key];
    const radius = key === '__bullpen__' ? BULLPEN_RADIUS : CLUSTER_RADIUS;
    list.forEach((t, i) => {
      const target = clusterSlot(i, list.length, center, radius);
      if (animate && t.mesh) {
        animateTo(t.mesh, target);
      } else if (t.mesh) {
        t.mesh.position.copy(target);
      }
      t.homePosition = target;
    });
  });
}

function animateTo(mesh, target, duration = 400) {
  const start = mesh.position.clone();
  const startTime = performance.now();
  function step(now) {
    const p = Math.min((now - startTime) / duration, 1);
    mesh.position.lerpVectors(start, target, p);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------- Build transformer meshes ----------
function buildTransformers(list) {
  list.forEach(t => {
    const size = 1.6 + (t.rating_kva ? Math.min(t.rating_kva / 2500, 1) * 0.8 : 0);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(size, size * 1.2, size),
      new THREE.MeshStandardMaterial({ color: colorForProject(t.project) })
    );
    mesh.userData = { po_number: t.po_number, isTransformer: true };
    mesh.position.set(0, 1.4, 0);
    transformerGroup.add(mesh);
    t.mesh = mesh;
  });
}

// ---------- Load data ----------
fetch('data/procurement_data.json?t=' + Date.now())
  .then(r => r.json())
  .then(json => {
    transformers = json.transformers;
    projects = json.projects;

    document.getElementById('meta').textContent =
      `${json.total_transformers} transformers · ${json.total_projects} projects`;

    buildProjects(projects);
    buildTransformers(transformers);
    relayout(false);
    updateCounts();
  })
  .catch(e => {
    document.getElementById('meta').textContent = 'Could not load data: ' + e.message;
  });

function updateCounts() {
  const unallocated = transformers.filter(t => !t.project).length;
  document.getElementById('bullpenCount').textContent = unallocated;
  document.getElementById('allocCount').textContent = transformers.length - unallocated;
}

// ---------- Raycasting: hover ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null;

function setMouseFromEvent(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

function getTransformerByMesh(mesh) {
  return transformers.find(t => t.mesh === mesh);
}

window.addEventListener('pointermove', (e) => {
  setMouseFromEvent(e);

  if (dragging) {
    dragTransformer(e);
    return;
  }

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(transformerGroup.children);
  if (hits.length) {
    const mesh = hits[0].object;
    if (hovered !== mesh) {
      if (hovered) hovered.material.emissive?.setHex(0x000000);
      hovered = mesh;
      mesh.material.emissive = new THREE.Color(0x333333);
    }
    const t = getTransformerByMesh(mesh);
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY + 16) + 'px';
    tooltip.innerHTML = `<b>${t.po_number}</b><br>
      Project: ${t.project || '<i>Unallocated</i>'}<br>
      Rating: ${t.rating_kva ?? '–'} kVA<br>
      State: ${t.state ?? '–'} · Utility: ${t.utility ?? '–'}<br>
      Stage: ${t.allocation_stage ?? '–'}`;
  } else {
    if (hovered) { hovered.material.emissive?.setHex(0x000000); hovered = null; }
    tooltip.style.display = 'none';
  }
});

// ---------- Dragging ----------
let dragging = null; // transformer object being dragged

renderer.domElement.addEventListener('pointerdown', (e) => {
  setMouseFromEvent(e);
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(transformerGroup.children);
  if (hits.length) {
    const mesh = hits[0].object;
    dragging = getTransformerByMesh(mesh);
    controls.enabled = false;
  }
});

window.addEventListener('pointerup', () => {
  if (!dragging) return;
  finishDrag(dragging);
  dragging = null;
  controls.enabled = true;
});

function dragTransformer(e) {
  raycaster.setFromCamera(mouse, camera);
  const point = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, point);
  if (point) dragging.mesh.position.set(point.x, 3, point.z);
}

function finishDrag(t) {
  // Find nearest zone: bullpen center or a project position
  const pos2D = new THREE.Vector2(t.mesh.position.x, t.mesh.position.z);
  let nearestKey = null;
  let nearestDist = pos2D.distanceTo(new THREE.Vector2(0, 0)); // bullpen center

  Object.entries(projectPositions).forEach(([name, p]) => {
    const d = pos2D.distanceTo(new THREE.Vector2(p.x, p.z));
    if (d < nearestDist) { nearestDist = d; nearestKey = name; }
  });

  // Snap logic: if within threshold of a project OR closer to bullpen than any project, reassign
  const distToBullpen = pos2D.distanceTo(new THREE.Vector2(0, 0));
  if (nearestKey && nearestDist < DROP_THRESHOLD) {
    t.project = nearestKey;
    t.mesh.material.color.setHex(colorForProject(nearestKey));
  } else if (distToBullpen < BULLPEN_RADIUS + DROP_THRESHOLD) {
    t.project = null;
    t.mesh.material.color.setHex(colorForProject(null));
  }
  // else: dropped in open space — snaps back to current zone via relayout

  relayout(true);
  updateCounts();
}

// ---------- Export ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  const output = {
    generated_at: new Date().toISOString(),
    total_transformers: transformers.length,
    total_projects: projects.length,
    transformers: transformers.map(({ mesh, homePosition, ...rest }) => rest),
    projects,
  };
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'procurement_data_updated.json';
  a.click();
});

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Render loop ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
